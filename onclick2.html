</head>
<body>

 {q:"Dinner is ___ now.", a:["served","serving","serve"], c:0},
 {q:"The songs were ___ by the choir.", a:["sang","sung","sing"], c:1},
 {q:"The ball was ___ by him.", a:["kick","kicking","kicked"], c:2},
 {q:"She ___ the story.", a:["told","was telling","tells"], c:2},

 {q:"The book was ___ in 1990.", a:["publish","published","publishing"], c:1},
 {q:"They ___ the match.", a:["won","was won","winning"], c:0},

 {q:"The game ___ yesterday.", a:["was played","played","play"], c:0},

const form = document.getElementById("quizForm");
questions.forEach((q,i)=>{
 let div = document.createElement("div");
 div.className = "question";
 div.innerHTML = `<p><b>${i+1}. ${q.q}</b></p>` +
 q.a.map((opt,j)=> `<label><input type='radio' name='q${i}' value='${j}'> ${opt}</label><br>`).join("");
 form.appendChild(div);
});

function submitQuiz(){
 let score = 0;
 document.querySelectorAll('.question').forEach((div,i)=>{
   const selected = document.querySelector(`input[name='q${i}']:checked`);
   div.classList.remove('correct','wrong');
   if(selected){
      if(parseInt(selected.value) === questions[i].c){ score++; div.classList.add('correct'); }
      else{ div.classList.add('wrong'); }
   } else { div.classList.add('wrong'); }
 });
 document.getElementById('result').innerHTML = `<h2>Your Score: ${score}/50</h2>`;
}
</script>

</body>
</html>
